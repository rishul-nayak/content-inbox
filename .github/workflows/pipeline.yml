name: Content Inbox pipeline

on:
  schedule:
    - cron: "30 1 * * *"    # 07:00 IST — judges new items and plans today's checklist
    - cron: "30 15 * * *"   # 21:00 IST — judges new items only
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = real run · dry-run = write nothing to Notion · test-urls = judge the links below and print"
        type: choice
        options: [normal, dry-run, test-urls]
        default: normal
      plan:
        description: "Plan today's checklist even if it's not the morning run"
        type: boolean
        default: false
      test_urls:
        description: "For test-urls mode: links separated by spaces"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: content-inbox
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_PLAYLIST_ID: ${{ secrets.YT_PLAYLIST_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          MODE: ${{ inputs.mode || 'normal' }}
          PLAN: ${{ inputs.plan && '--plan' || '' }}
          TEST_URLS: ${{ inputs.test_urls }}
        run: |
          set -f  # no glob expansion of URLs
          case "$MODE" in
            dry-run)   python pipeline.py --dry-run $PLAN ;;
            test-urls) args=""; for u in $TEST_URLS; do args="$args --test-url $u"; done; python pipeline.py $args ;;
            *)         python pipeline.py $PLAN ;;
          esac

      - name: Commit run state (keeps quota counters + repo activity)
        if: ${{ (inputs.mode || 'normal') == 'normal' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_run.json
          git diff --cached --quiet && exit 0
          git commit -m "state: run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
